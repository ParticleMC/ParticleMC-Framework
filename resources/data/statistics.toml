# 统计注册表（T13）。
# 语义对齐 Java `StatisticCategory`（枚举序位 0..=8）与 `custom_statistics` 注册表：
#   category：0=MINED、1=CRAFTED、2=USED、3=BROKEN、4=PICKED_UP、5=DROPPED、
#             6=KILLED、7=KILLED_BY、8=CUSTOM
#   id：CUSTOM 类取 `custom_statistics` 注册表 id（见 generic/custom_statistics.toml）；
#       MINED 类取方块注册表 id（blocks.toml）；USED 类取物品注册表 id（items.toml）；
#       KILLED/KILLED_BY 类取实体类型注册表 id（entity_types.toml）。
